<html lang="es-MX">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elemental Club · Propuestas de crecimiento</title>

<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d2421; --muted:#5d6763; --line:#e4e0d6;
  --brand:#0f2a24; --brand2:#1f5c4d; --accent:#d9a441; --ok:#2e8b57; --warn:#d08a1c; --no:#c0392b;
  --radius:18px; --shadow:0 2px 10px rgb(0 0 0 / .06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:17px;padding-bottom:96px}
a{color:var(--brand2)}
img{max-width:100%;display:block}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:#fff;padding:14px 0;position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:15px;text-decoration:none;color:#fff}
.logo span{color:var(--accent)}
.top-link{color:#fff;opacity:.85;font-size:14px;text-decoration:none}
.hero{position:relative;color:#fff;background:var(--brand)}
.hero img{width:100%;aspect-ratio:16/9;object-fit:cover;opacity:.55}
.hero .txt{position:absolute;inset:auto 0 0 0;padding:20px 0 22px;background:linear-gradient(transparent,rgb(15 42 36 / .95))}
.hero h1{margin:0 0 6px;font-size:clamp(26px,6vw,40px);line-height:1.15;text-wrap:balance}
.hero p{margin:0;opacity:.92;font-size:16px}
section{padding:26px 0 6px}
h2{font-size:23px;margin:0 0 12px;line-height:1.2;text-wrap:balance}
h3{font-size:19px;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;color:var(--brand)}
.stat small{color:var(--muted);font-size:14px}
.steps{display:grid;gap:10px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{background:var(--card);border-radius:14px;padding:12px 14px 12px 52px;position:relative;box-shadow:var(--shadow)}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:grid;place-items:center;font-size:14px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.group-title{margin:18px 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cards{display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border:2px solid transparent}
.card[data-vote="si"]{border-color:var(--ok)}
.card[data-vote="duda"]{border-color:var(--warn)}
.card[data-vote="no"]{border-color:var(--no)}
.card .head{display:flex;gap:12px;align-items:flex-start}
.emoji{font-size:30px;line-height:1;flex:none;width:44px;height:44px;border-radius:12px;background:#f1ede3;display:grid;place-items:center}
.card h3{margin:0;font-size:18px}
.num{font-size:13px;color:var(--muted);font-weight:600}
.card p{margin:6px 0 0;color:var(--muted);font-size:16px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.pill{background:#f1ede3;border-radius:10px;padding:5px 10px;font-size:14px}
.pill b{color:var(--brand)}
.pill.good{background:#e3f2e9}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.btn-more{display:inline-flex;align-items:center;gap:6px;background:var(--brand);color:#fff;text-decoration:none;padding:10px 14px;border-radius:12px;font-weight:600;font-size:15px}
.vote{display:flex;gap:6px;margin-left:auto}
.vote button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font-size:15px;cursor:pointer;color:var(--ink);min-height:42px}
.vote button[aria-pressed="true"][data-v="si"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.vote button[aria-pressed="true"][data-v="duda"]{background:var(--warn);color:#fff;border-color:var(--warn)}
.vote button[aria-pressed="true"][data-v="no"]{background:var(--no);color:#fff;border-color:var(--no)}
.cancel{opacity:.7}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:#eee;color:#555;margin-left:6px;vertical-align:middle}
.badge.top{background:#fff2d6;color:#8a5a00}
.note{background:#fff8e6;border-left:4px solid var(--accent);padding:12px 14px;border-radius:10px;font-size:16px}
.risk{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.risk h3{font-size:17px}
.risk a{font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgb(0 0 0 / .08);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bar .wrap{display:flex;align-items:center;gap:10px}
.bar .count{font-size:14px;color:var(--muted);flex:1}
.bar .count b{color:var(--ink);font-size:16px}
.btn-wa{background:#25d366;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
/* detalle */
.back{display:inline-flex;gap:6px;align-items:center;text-decoration:none;font-weight:600;margin:16px 0 4px}
.dhead{display:flex;gap:14px;align-items:center;margin:8px 0 6px}
.dhead .emoji{width:60px;height:60px;font-size:38px}
.dhead h1{font-size:clamp(24px,5.5vw,34px);margin:0;line-height:1.15;text-wrap:balance}
.box{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin:12px 0}
.box h2{font-size:20px}
.box ul{margin:0;padding-left:20px}
.box li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right;white-space:nowrap;font-weight:600}
tr.total td{border-bottom:0;font-weight:800}
.range{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px}
.range div{background:#f6f4ef;border-radius:12px;padding:10px 6px;font-size:13px;color:var(--muted)}
.range b{display:block;font-size:17px;color:var(--ink)}
.range .mid{background:#e3f2e9}
details{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin:8px 0;overflow:hidden}
summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--brand2)}
details[open] summary::after{content:"－"}
details .in{padding:0 18px 14px}
details .in p{margin:0 0 10px}
.drive{display:inline-flex;align-items:center;gap:8px;margin:6px 0 20px;font-weight:600}
.dvote{display:flex;gap:8px;flex-wrap:wrap}
.dvote button{flex:1;min-width:100px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:16px;cursor:pointer;color:var(--ink)}
.dvote button[aria-pressed="true"][data-v="si"]{background:var(--ok);color:#fff}
.dvote button[aria-pressed="true"][data-v="duda"]{background:var(--warn);color:#fff}
.dvote button[aria-pressed="true"][data-v="no"]{background:var(--no);color:#fff}
.navnext{display:flex;justify-content:space-between;gap:10px;margin:18px 0}
.navnext a{flex:1;background:#fff;border-radius:12px;padding:12px;text-decoration:none;box-shadow:var(--shadow);font-size:15px}
.navnext a:last-child{text-align:right}
footer{color:var(--muted);font-size:13px;text-align:center;padding:30px 16px}
input[type=text]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px}
@media (prefers-reduced-motion:no-preference){.card,.chip,.vote button{transition:border-color .2s,background-color .2s}}
</style>
</head>

      "gasto_mensual": 72500,
      "ingreso_mensual": 482500,
      "ganancia_mensual": 410000,
      "ganancia_optimista": 495000,
      "ganancia_conservadora": 325000,
      "meses_recuperacion": 9.9,
      "incluye": ["S18"],
      "nota": "Necesita la azotea del edificio de estacionamiento (E01) para existir."
    }
  ],
  "estacionamiento_mas_padel": {
    "inversion": 12050000,
    "gasto_mensual": 81500,
    "ingreso_mensual": 571500,
    "ganancia_mensual": 490000,
    "ganancia_optimista": 590000,
    "ganancia_conservadora": 390000,
    "meses_recuperacion": 24.6,
    "incluye": ["E01", "S18"]
  },
  "mensaje_auditoria": "Para no prometer de más, cada propuesta se revisó dos veces. Primero se hicieron dos cuentas: una optimista, que supone que todo sale bien y el club se llena (ganancia de unos $1,165,000 al mes), y una conservadora, que supone menos clientes, arranques lentos y materiales más caros (ganancia de unos $684,000 al mes). Después se acordaron medidas para protegernos, como preventas 60 días antes de abrir cada servicio, contratos con depósito en garantía para quienes operen servicios dentro del club, cobros domiciliados y compras en volumen de acero y equipo. Con eso se tomó el punto medio como cifra oficial: invertir unos $18.5 millones para ganar unos $925,000 al mes (unos $11.1 millones al año) y recuperar la inversión en unos 20 meses. Es decir, por cada $1 invertido regresan unos $0.60 al año."
}
,"drive":{}}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ITEMS = DATA.items;           // iniciativas (sin riesgos)
const RISKS = DATA.risks;           // R01..R06
const RES = DATA.resumen || {};
const DRIVE = DATA.drive || {};     // codigo -> url
const app = document.getElementById('app');
const KEY = 'elemental-votos-v1';
let votes = {};
try { votes = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
let filter = 'Todos';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n == null || isNaN(n)) ? '—' : '$' + Math.round(n).toLocaleString('es-MX');
const short = n => {
  if (n == null || isNaN(n)) return '—';
  if (Math.abs(n) >= 1e6) return '$' + (n/1e6).toLocaleString('es-MX',{maximumFractionDigits:1}) + ' millones';
  if (Math.abs(n) >= 1e3) return '$' + Math.round(n/1e3).toLocaleString('es-MX') + ' mil';
  return money(n);
};
const meses = m => (m == null || isNaN(m)) ? '—' : (m < 12 ? `${(+m).toLocaleString('es-MX',{maximumFractionDigits:1})} meses` : `${(+m).toLocaleString('es-MX',{maximumFractionDigits:1})} meses (≈ ${(m/12).toLocaleString('es-MX',{maximumFractionDigits:1})} años)`);
const list = arr => (arr && arr.length) ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
const votable = it => !it.cancelado;
const ORDER = ['Nuevos servicios','Mejoras al club actual','Infraestructura'];

function save(){ localStorage.setItem(KEY, JSON.stringify(votes)); updateBar(); }
function setVote(code, v){
  votes[code] = votes[code] === v ? undefined : v;
  if (!votes[code]) delete votes[code];
  save();
  document.querySelectorAll(`[data-code="${code}"]`).forEach(el => {
    if (el.classList.contains('card')) el.dataset.vote = votes[code] || '';
    el.querySelectorAll('button[data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === votes[code])));
  });
}
function voteButtons(code, cls='vote'){
  const v = votes[code];
  return `<div class="${cls}" data-code="${code}" role="group" aria-label="Mi decisión">
    <button type="button" data-v="si" aria-pressed="${v==='si'}">✅${cls==='dvote'?' Apruebo':''}</button>
    <button type="button" data-v="duda" aria-pressed="${v==='duda'}">🤔${cls==='dvote'?' Tengo dudas':''}</button>
    <button type="button" data-v="no" aria-pressed="${v==='no'}">❌${cls==='dvote'?' No por ahora':''}</button></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-v]');
  if (b) { const g = b.closest('[data-code]'); setVote(g.dataset.code, b.dataset.v); }
  const c = e.target.closest('.chip[data-f]');
  if (c) { filter = c.dataset.f; renderIndex(true); }
});

function card(it, i){
  const c = it.cifras || {};
  if (it.cancelado) return `<article class="card cancel"><div class="head"><div class="emoji">${esc(it.emoji)}</div><div><div class="num">${esc(it.codigo)}</div><h3>${esc(it.titulo)} <span class="badge">Cancelado</span></h3><p>${esc(it.frase)}</p></div></div><div class="actions"><a class="btn-more" href="#/${esc(it.codigo)}">Ver por qué →</a></div></article>`;
  const fast = c.meses_recuperacion != null && c.meses_recuperacion <= 6;
  return `<article class="card" data-code="${esc(it.codigo)}" data-vote="${votes[it.codigo]||''}">
    <div class="head"><div class="emoji" aria-hidden="true">${esc(it.emoji)}</div>
    <div><div class="num">${esc(it.codigo)}</div><h3>${esc(it.titulo)}${fast?'<span class="badge top">Se paga rápido</span>':''}</h3><p>${esc(it.frase)}</p></div></div>
    <div class="pills">
      <span class="pill">Inversión: <b>${short(c.inversion)}</b></span>
      <span class="pill good">Deja al mes: <b>${short(c.ganancia_mensual)}</b></span>
      <span class="pill">Se recupera en: <b>${c.meses_recuperacion!=null?(+c.meses_recuperacion).toLocaleString('es-MX',{maximumFractionDigits:1})+' meses':'—'}</b></span>
    </div>
    <div class="actions"><a class="btn-more" href="#/${esc(it.codigo)}">Ver todo el detalle →</a>${voteButtons(it.codigo)}</div>
  </article>`;
}

function renderIndex(keepScroll){
  document.title = 'Elemental Club · Propuestas de crecimiento';
  const y = window.scrollY;
  const cats = ['Todos', ...ORDER, 'Más rápidas de recuperar'];
  let groups;
  if (filter === 'Más rápidas de recuperar') {
    groups = [['Ordenadas de la que se paga más rápido a la más lenta', ITEMS.filter(votable).slice().sort((a,b)=>(a.cifras?.meses_recuperacion??999)-(b.cifras?.meses_recuperacion??999))]];
  } else {
    groups = ORDER.filter(c => filter==='Todos' || filter===c).map(c => [c, ITEMS.filter(i => i.categoria===c)]);
  }
  const t = RES;
  app.innerHTML = `
  <div class="hero"><img src="render.jpg" alt="Vista aérea del plan maestro de Elemental Club" fetchpriority="high"><div class="txt"><div class="wrap">
    <h1>Plan de crecimiento de Elemental Club</h1><p>${ITEMS.filter(votable).length} propuestas para revisar y aprobar entre socios</p></div></div></div>
  <div class="wrap">
    <section>
      <h2>El plan en 3 números</h2>
      <div class="stats">
        <div class="stat"><b>${short(t.total_inversion)}</b><small>Inversión total si se aprueba todo</small></div>
        <div class="stat"><b>${short(t.total_ganancia_mensual)}</b><small>Ganancia estimada al mes, ya operando</small></div>
        <div class="stat"><b>${t.meses_recuperacion ? (+t.meses_recuperacion).toLocaleString('es-MX') + ' meses' : '—'}</b><small>Tiempo para recuperar la inversión</small></div>
      </div>
      <p class="lead" style="margin-top:12px">Cada propuesta se puede aprobar por separado. No es "todo o nada".</p>
    </section>
    <section>
      <h2>¿Cómo usar esta página?</h2>
      <ol class="steps">
        <li>Recorre el índice: cada tarjeta te dice qué es, cuánto cuesta y cuánto deja.</li>
        <li>Toca <b>"Ver todo el detalle"</b> si quieres conocer la propuesta a fondo.</li>
        <li>Marca ✅ apruebo, 🤔 tengo dudas o ❌ no por ahora.</li>
        <li>Al final toca <b>"Enviar mi decisión"</b> y se arma tu respuesta en WhatsApp.</li>
      </ol>
    </section>
    <section id="indice">
      <h2>Índice de propuestas</h2>
      <div class="filters" role="toolbar" aria-label="Filtrar">${cats.map(c=>`<button class="chip" type="button" data-f="${esc(c)}" aria-pressed="${c===filter}">${esc(c)}</button>`).join('')}</div>
      ${groups.map(([g, arr]) => `<h3 class="group-title">${esc(g)} · ${arr.filter(votable).length}</h3><div class="cards">${arr.map(card).join('')}</div>`).join('')}
    </section>
    ${t.bloques ? `<section><h2>Resumen por grupo</h2><div class="box"><table>${t.bloques.map(b=>`<tr><td><b>${esc(b.nombre_simple)}</b><br><small style="color:var(--muted)">Deja ${short(b.ganancia_mensual)} al mes · se recupera en ${b.meses_recuperacion?esc(b.meses_recuperacion)+' meses':'—'}</small></td><td>${short(b.inversion)}</td></tr>`).join('')}
      <tr class="total"><td>Total</td><td>${short(t.total_inversion)}</td></tr></table></div></section>`:''}
    <section>
      <h2>¿Qué tan confiables son las cifras?</h2>
      <div class="note">${esc(t.mensaje_auditoria || '')}</div>
      ${t.optimista && t.conservador ? `<div class="range"><div>Si va muy bien<b>${short(t.optimista.ganancia_mensual)}</b>al mes</div><div class="mid">Escenario usado<b>${short(t.total_ganancia_mensual)}</b>al mes</div><div>Si va lento<b>${short(t.conservador.ganancia_mensual)}</b>al mes</div></div>`:''}
    </section>
    <section>
      <h2>Riesgos que ya se identificaron (y cómo se cuidan)</h2>
      <p class="lead">Lo que podría salir mal y qué se propone para evitarlo.</p>
      ${RISKS.map(r=>`<div class="risk"><h3>${esc(r.emoji)} ${esc(r.titulo)}</h3><p style="margin:0 0 6px;color:var(--muted)">${esc(r.frase)}</p><a href="#/${esc(r.codigo)}">Ver riesgos y soluciones →</a></div>`).join('')}
    </section>
    <section>
      <h2>Tu nombre</h2>
      <p class="lead">Para que tu respuesta llegue firmada.</p>
      <input type="text" id="nombre" autocomplete="name" placeholder="Escribe tu nombre" value="${esc(localStorage.getItem('elemental-nombre')||'')}">
    </section>
  </div>`;
  document.getElementById('nombre').addEventListener('input', e => localStorage.setItem('elemental-nombre', e.target.value));
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0,0);
}

function renderDetail(code){
  const all = [...ITEMS, ...RISKS];
  const it = all.find(x => x.codigo === code);
  if (!it) { location.hash = '#/'; return; }
  document.title = `${it.titulo} · Elemental Club`;
  const c = it.cifras;
  const seq = ITEMS.filter(votable).concat(RISKS);
  const idx = seq.findIndex(x => x.codigo === code);
  const prev = seq[idx-1], next = seq[idx+1];
  const isRisk = it.categoria === 'Riesgos';
  const rel = (it.iniciativas_relacionadas||[]).map(k => ITEMS.find(x=>x.codigo===k)).filter(Boolean);
  app.innerHTML = `<div class="wrap">
    <a class="back" href="#/" data-back>← Volver al índice</a>
    <div class="dhead"><div class="emoji" aria-hidden="true">${esc(it.emoji)}</div><div><div class="num">${esc(it.codigo)} · ${esc(it.categoria)}</div><h1>${esc(it.titulo)}</h1></div></div>
    <p style="font-size:18px">${esc(it.frase)}</p>
    ${it.cancelado ? `<div class="note">Esta propuesta <b>se canceló</b> y no se somete a votación.</div>` : ''}
    ${c && !it.cancelado ? `<div class="box"><h2>Los números</h2>
      <div class="stats">
        <div class="stat"><b>${money(c.inversion)}</b><small>Inversión inicial</small></div>
        <div class="stat"><b>${money(c.ganancia_mensual)}</b><small>Ganancia al mes</small></div>
        <div class="stat"><b>${c.meses_recuperacion!=null?(+c.meses_recuperacion).toLocaleString('es-MX',{maximumFractionDigits:1})+' meses':'—'}</b><small>Para recuperar lo invertido</small></div>
      </div>
      ${(c.ingreso_mensual||c.gasto_mensual)?`<p style="font-size:14px;color:var(--muted);margin:12px 0 0">Si va muy bien, al mes:</p><table><tr><td>Lo que entra al mes</td><td>${money(c.ingreso_mensual)}</td></tr><tr><td>Lo que se gasta al mes</td><td>${money(c.gasto_mensual)}</td></tr></table>`:''}
      ${(c.ganancia_optimista!=null&&c.ganancia_conservadora!=null)?`<div class="range"><div>Si va lento<b>${short(c.ganancia_conservadora)}</b>al mes</div><div class="mid">Escenario usado<b>${short(c.ganancia_mensual)}</b>al mes</div><div>Si va muy bien<b>${short(c.ganancia_optimista)}</b>al mes</div></div>`:''}
      ${it.notas_cifras?`<details style="box-shadow:none;background:#f6f4ef;margin-top:12px"><summary style="font-size:14px;padding:10px 14px">Nota sobre cómo se calcularon estas cifras</summary><div class="in" style="font-size:14px;color:var(--muted)">${esc(it.notas_cifras)}</div></details>`:''}
    </div>`:''}
    ${it.cifras_con_padel?`<div class="note"><b>Visto junto con el Club de Pádel:</b> inversión de ${short(it.cifras_con_padel.inversion)}, ganancia de ${short(it.cifras_con_padel.ganancia_mensual)} al mes y se recupera en ${esc(it.cifras_con_padel.meses_recuperacion)} meses. El estacionamiento es lo que hace posible el pádel. <a href="#/S18">Ver Club de Pádel →</a></div>`:''}
    ${it.que_es?`<div class="box"><h2>¿Qué es?</h2><p style="margin:0">${esc(it.que_es)}</p></div>`:''}
    ${it.por_que_conviene?.length?`<div class="box"><h2>¿Por qué conviene?</h2>${list(it.por_que_conviene)}</div>`:''}
    ${it.donde?`<div class="box"><h2>¿Dónde estaría?</h2><p style="margin:0">${esc(it.donde)}</p></div>`:''}
    ${it.como_funciona?.length?`<div class="box"><h2>¿Cómo funcionaría?</h2>${list(it.como_funciona)}</div>`:''}
    ${it.precios?.length?`<div class="box"><h2>Precios para socios y clientes</h2>${list(it.precios)}</div>`:''}
    ${it.que_incluye_la_inversion?.length?(()=>{const rows=it.que_incluye_la_inversion;const sum=rows.reduce((a,x)=>a+(+x.monto||0),0);const dif=(c&&c.inversion)?c.inversion-sum:0;return `<div class="box"><h2>¿En qué se usa la inversión?</h2><table>${rows.map(x=>`<tr><td>${esc(x.concepto)}</td><td>${money(x.monto)}</td></tr>`).join('')}${dif>0?`<tr><td>Reserva para imprevistos y alzas de precio</td><td>${money(dif)}</td></tr>`:''}${c&&c.inversion?`<tr class="total"><td>Total</td><td>${money(Math.max(c.inversion,sum))}</td></tr>`:''}</table></div>`})():''}
    ${it.riesgos?.length?`<div class="box"><h2>${isRisk?'Riesgos y soluciones':'¿Qué podría salir mal y cómo se evita?'}</h2>${it.riesgos.map(r=>`<p style="margin:0 0 4px"><b>⚠️ ${esc(r.riesgo)}</b></p><p style="margin:0 0 12px">✔️ ${esc(r.solucion)}</p>`).join('')}</div>`:''}
    ${rel.length?`<div class="box"><h2>Propuestas relacionadas</h2><ul>${rel.map(r=>`<li><a href="#/${esc(r.codigo)}">${esc(r.emoji)} ${esc(r.titulo)}</a></li>`).join('')}</ul></div>`:''}
    ${it.siguientes_pasos?.length?`<div class="box"><h2>Siguientes pasos si se aprueba</h2>${list(it.siguientes_pasos)}</div>`:''}
    ${it.detalle?.length?`<h2 style="margin-top:22px">Información completa</h2><p class="lead">Toca cada tema para abrirlo.</p>${it.detalle.map(d=>`<details><summary>${esc(d.titulo)}</summary><div class="in">${(d.texto||[]).map(t=>`<p>${esc(t)}</p>`).join('')}</div></details>`).join('')}`:''}
    ${DRIVE[it.codigo]?`<a class="drive" href="${esc(DRIVE[it.codigo])}" target="_blank" rel="noopener">📄 Ver el expediente original completo</a>`:''}
    ${!isRisk && votable(it)?`<div class="box"><h2>Mi decisión sobre esta propuesta</h2>${voteButtons(it.codigo,'dvote')}</div>`:''}
    <nav class="navnext">${prev?`<a href="#/${esc(prev.codigo)}">← ${esc(prev.titulo)}</a>`:'<span></span>'}${next?`<a href="#/${esc(next.codigo)}">${esc(next.titulo)} →</a>`:'<span></span>'}</nav>
  </div>`;
  window.scrollTo(0,0);
}

function updateBar(){
  const total = ITEMS.filter(votable).length;
  const n = Object.keys(votes).length;
  const s = Object.values(votes).filter(v=>v==='si').length;
  document.getElementById('bar').hidden = false;
  document.getElementById('count').innerHTML = `<b>${n} de ${total}</b> revisadas · ${s} aprobadas`;
}
document.getElementById('send').addEventListener('click', () => {
  const name = localStorage.getItem('elemental-nombre') || '';
  const by = v => ITEMS.filter(i => votes[i.codigo]===v).map(i => `• ${i.codigo} ${i.titulo}`);
  const si = by('si'), du = by('duda'), no = by('no');
  const pend = ITEMS.filter(i => votable(i) && !votes[i.codigo]).length;
  if (!si.length && !du.length && !no.length) { alert('Aún no marcas ninguna propuesta. Usa ✅ 🤔 ❌ en cada tarjeta.'); return; }
  let msg = `*Elemental Club – Mi decisión sobre las propuestas*${name?`\nDe: ${name}`:''}\n`;
  if (si.length) msg += `\n✅ *Apruebo (${si.length})*\n${si.join('\n')}\n`;
  if (du.length) msg += `\n🤔 *Tengo dudas (${du.length})*\n${du.join('\n')}\n`;
  if (no.length) msg += `\n❌ *No por ahora (${no.length})*\n${no.join('\n')}\n`;
  if (pend) msg += `\n(Sin revisar: ${pend})`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener');
});

function route(){
  const code = location.hash.replace(/^#\/?/, '');
  if (code) renderDetail(code); else renderIndex(false);
}
addEventListener('hashchange', route);
route(); updateBar();
</script>
</body>
</html>
